[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name = "webmaker"
version = "0.1.0"
description = "AI-powered WordPress demo site generator"
requires-python = ">=3.10"
readme = "README.md"
license = { text = "Proprietary — commercial use requires permission" }

dependencies = [
    "streamlit>=1.35.0",
    "playwright>=1.45.0",
    "beautifulsoup4>=4.12.0",
    "requests>=2.32.0",
    "lxml>=5.2.0",
    "pillow>=10.3.0",
    "python-dotenv>=1.0.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pandas>=2.2.0",
    "loguru>=0.7.0",
    "rich>=13.7.0",
    "tqdm>=4.66.0",
    "anthropic>=0.28.0",
    "google-genai>=0.8.0",
    "openai>=1.30.0",
    "httpx>=0.27.0",
    "aiohttp>=3.9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
webmaker = "run:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["webmaker*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"
